# PREP-only CI workflow
# Lint and build only - no deploy steps, no secrets required
# This is a draft workflow for SPEC-MA-PROD-V1 PREP phase

name: PREP CI (lint/build only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/prep/**'
      - '.github/workflows/prep-ci.yml'

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check markdown files exist
        run: |
          test -f docs/prep/AUDIT.md
          test -f docs/prep/BASELINE.md
          test -f docs/prep/PLAN.md
          test -f docs/prep/COST.md
          
      - name: Validate no secrets in docs
        run: |
          # Check for common secret patterns in docs
          if grep -rE '(sk-[a-zA-Z0-9]{20,}|whsec_[a-zA-Z0-9]+|AKIA[A-Z0-9]{16})' docs/prep/; then
            echo "ERROR: Potential secrets found in docs"
            exit 1
          fi
          echo "No secrets detected in docs"
          
      - name: Check for forbidden brand strings in PREP docs
        run: |
          # Denylist check for brand strings (case-insensitive) in PREP docs only
          # Pattern avoids literal brand name in the rule itself
          PATTERN='[Kk][Aa][Rr][Ee][Vv]'
          echo "Checking for forbidden brand strings in docs/prep/..."
          if grep -rEi "$PATTERN" docs/prep/ 2>/dev/null; then
            echo "ERROR: Forbidden brand strings found in PREP docs"
            exit 1
          fi
          echo "No forbidden brand strings found in PREP docs"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        
      - name: Lint frontend (allow failure for PREP)
        working-directory: frontend
        run: npm run lint || echo "Lint errors exist - tracked in BASELINE.md"
