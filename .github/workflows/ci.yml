name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs targeting any branch (enables stacked PR CI)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @meeting-assistant/shared
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @meeting-assistant/shared
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Bootstrap app role
        # NOSUPERUSER NOBYPASSRLS app role, as on managed Postgres. The login
        # password is a throwaway test-only value (same as the test harness).
        run: psql -v ON_ERROR_STOP=1 -h localhost -U test -d test -f db/bootstrap-roles.sql
        env:
          PGPASSWORD: test
      - name: Run migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U test -d test -f "$f"
          done
        env:
          PGPASSWORD: test
      - name: Enable app role login
        run: psql -v ON_ERROR_STOP=1 -h localhost -U test -d test -c "ALTER ROLE meeting_assistant_app WITH LOGIN PASSWORD 'app-test-secret'"
        env:
          PGPASSWORD: test
      - run: npm run test -- --run
        env:
          NODE_ENV: test
          # Owner / migrations (CI superuser).
          DATABASE_URL: postgres://test:test@localhost:5432/test
          # App runtime: the restricted app role, never the owner. No fallback.
          APP_DATABASE_URL: postgres://meeting_assistant_app:app-test-secret@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          RECALL_WEBHOOK_SECRET: whsec_test_secret_for_ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          RECALL_WEBHOOK_SECRET: whsec_test_secret_for_ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical || echo "Non-critical vulnerabilities exist - see npm audit output"
      - name: Check for forbidden brand strings
        run: |
          # Denylist check for brand strings (case-insensitive)
          # Pattern avoids literal brand name in the rule itself
          PATTERN='[Kk][Aa][Rr][Ee][Vv]'
          echo "Checking for forbidden brand strings..."
          if grep -rEi "$PATTERN" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --include="*.md" . 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v '\.github/'; then
            echo "ERROR: Forbidden brand strings found in source files"
            exit 1
          fi
          echo "No forbidden brand strings found"
